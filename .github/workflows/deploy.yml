name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  # ===========================================================================
  # 1. Backend & Unit Tests
  # ===========================================================================
  test-backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pytest

      - name: Run Pytest Unit Tests
        run: |
          python -m pytest tests/unit/ -v

  # ===========================================================================
  # 2. Frontend Build & Typecheck
  # ===========================================================================
  test-frontend:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Production Artifacts
        working-directory: ./frontend
        run: npm run build

  # ===========================================================================
  # 3. Terraform Validation
  # ===========================================================================
  validate-infra:
    name: Terraform Format & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform Init
        working-directory: ./infra
        run: terraform init -backend=false

      - name: Terraform Format Check
        working-directory: ./infra
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: ./infra
        run: terraform validate

  # ===========================================================================
  # 4. Deploy Infrastructure & Frontend (Runs only on Push to Main)
  # ===========================================================================
  deploy:
    name: Deploy to AWS
    needs: [test-backend, test-frontend, validate-infra]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        if: env.HAS_AWS_SECRETS == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
        env:
          HAS_AWS_SECRETS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}

      - name: Set up Terraform
        if: env.HAS_AWS_SECRETS == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"
        env:
          HAS_AWS_SECRETS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}

      - name: Terraform Init & Apply
        if: env.HAS_AWS_SECRETS == 'true'
        working-directory: ./infra
        run: |
          terraform init
          terraform apply -auto-approve
        env:
          HAS_AWS_SECRETS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}

      - name: Deploy Frontend to S3 and CloudFront
        if: env.HAS_AWS_SECRETS == 'true'
        run: |
          chmod +x ./scripts/deploy-frontend.sh
          ./scripts/deploy-frontend.sh
        env:
          HAS_AWS_SECRETS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
